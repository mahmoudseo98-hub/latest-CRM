<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · SEO For All OS</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
:root{
  --bg:#0B1220; --surface:#111827; --raised:#172033; --line:#2A3648;
  --ink:#F8FAFC; --ink-2:#CBD5E1; --muted:#94A3B8;
  --brand:#5a67f2; --brand-2:#8a5cf5; --danger:#FB7185; --ok:#34D399;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;padding:24px;
}
.card{
  width:100%;max-width:26rem;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:28px;
  box-shadow:0 16px 48px rgba(0,0,0,.45);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand[hidden],.field[hidden],.pw-wrap[hidden]{display:none}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:20px;margin:0 0 6px}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink-2)}
.field{margin-bottom:16px}
input[type=email],input[type=text],input[type=password]{
  width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);font-size:15px;padding:12px;min-height:48px;
}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(90,103,242,.25)}
input[aria-invalid=true]{border-color:var(--danger)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:76px}
.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;color:var(--muted);font-size:12.5px;font-weight:600;
  cursor:pointer;padding:8px 10px;border-radius:8px;min-height:44px;
}
.pw-toggle:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.row[hidden]{display:none} /* an author display rule beats the UA [hidden] rule */
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
button.primary{
  width:100%;min-height:46px;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-size:15px;font-weight:700;
}
button.primary:hover{filter:brightness(1.07)}
button.primary:disabled{opacity:.6;cursor:progress}
.alert{
  border-radius:10px;padding:11px 13px;font-size:13.5px;margin:0 0 18px;
  border:1px solid var(--danger);background:rgba(251,113,133,.12);color:#FFD9DF;
}
.alert.ok{border-color:var(--ok);background:rgba(52,211,153,.12);color:#C8F7E4}
.alert[hidden]{display:none}
.caps{font-size:12.5px;color:#FBBF24;margin:6px 0 0}
.caps[hidden]{display:none}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot a{color:var(--ink-2)}
.skeleton{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
@media (max-width:420px){
  .card{padding:22px 18px}
  input[type=email],input[type=text],input[type=password]{font-size:16px} /* stops iOS zooming in */
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">SF</span>
    <span><b>SEO For All</b><small>Company Intelligence OS</small></span>
  </div>

  <div id="boot" class="skeleton">Loading…</div>

  <form id="form" hidden novalidate>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Use your work email and password.</p>

    <div class="alert" id="alert" role="alert" hidden></div>

    <div class="field" id="nameField" hidden>
      <label for="displayName">Full name</label>
      <input id="displayName" name="displayName" type="text" autocomplete="name" autocapitalize="words">
    </div>

    <div class="field">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
      </div>
      <p class="hint" id="pwHint" hidden>At least 10 characters.</p>
      <p class="caps" id="caps" hidden>Caps Lock is on.</p>
    </div>

    <div class="row" id="rememberRow">
      <label class="check" for="remember">
        <input id="remember" type="checkbox">
        <span>Keep me signed in for 30 days</span>
      </label>
    </div>

    <button class="primary" id="submit" type="submit">Sign in</button>

    <p class="foot" id="foot">
      Forgotten your password? There is no email service configured on this deployment yet,
      so contact your administrator to have it reset.
    </p>
  </form>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var boot = document.getElementById('boot');
  var alertBox = document.getElementById('alert');
  var submit = document.getElementById('submit');
  var title = document.getElementById('title');
  var subtitle = document.getElementById('subtitle');
  var nameField = document.getElementById('nameField');
  var displayName = document.getElementById('displayName');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var pwHint = document.getElementById('pwHint');
  var caps = document.getElementById('caps');
  var foot = document.getElementById('foot');
  var rememberRow = document.getElementById('rememberRow');
  var mode = 'signin';

  function show(message, kind) {
    alertBox.textContent = message;
    alertBox.className = 'alert' + (kind === 'ok' ? ' ok' : '');
    alertBox.hidden = false;
  }
  function clearAlert() { alertBox.hidden = true; }

  // Only ever send people to a path on this site.
  function safeNext() {
    var raw = new URLSearchParams(location.search).get('next') || '/launcher.html';
    if (!raw.startsWith('/') || raw.startsWith('//')) return '/launcher.html';
    return raw;
  }

  function setMode(next) {
    mode = next;
    var registering = next === 'register';
    title.textContent = registering ? 'Create the owner account' : 'Sign in';
    subtitle.textContent = registering
      ? 'This is the first account on this workspace, so it becomes the Owner / CEO.'
      : 'Use your work email and password.';
    nameField.hidden = !registering;
    pwHint.hidden = !registering;
    rememberRow.hidden = registering;
    submit.textContent = registering ? 'Create account & sign in' : 'Sign in';
    password.setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
    foot.hidden = registering;
    document.title = (registering ? 'Create owner account' : 'Sign in') + ' · SEO For All OS';
  }

  document.getElementById('pwToggle').addEventListener('click', function () {
    var showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    this.textContent = showing ? 'Show' : 'Hide';
    this.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    password.focus();
  });

  password.addEventListener('keyup', function (e) {
    caps.hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearAlert();
    email.setAttribute('aria-invalid', 'false');
    password.setAttribute('aria-invalid', 'false');

    var body = { email: email.value.trim(), password: password.value };
    if (mode === 'register') body.displayName = displayName.value.trim();
    else body.remember = document.getElementById('remember').checked;

    var endpoint = mode === 'register' ? '/api/auth/bootstrap' : '/api/auth/login';
    submit.disabled = true;
    submit.textContent = mode === 'register' ? 'Creating…' : 'Signing in…';

    fetch(endpoint, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'x-seo-requested-with': 'web' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (r) {
      if (r.ok) { location.href = safeNext(); return; }
      submit.disabled = false;
      submit.textContent = mode === 'register' ? 'Create account & sign in' : 'Sign in';
      show(r.data && r.data.error ? r.data.error : 'Something went wrong. Please try again.');
      if (r.status === 401) { password.value = ''; password.setAttribute('aria-invalid', 'true'); password.focus(); }
    }).catch(function () {
      submit.disabled = false;
      submit.textContent = mode === 'register' ? 'Create account & sign in' : 'Sign in';
      show('Could not reach the server. Check your connection and try again.');
    });
  });

  fetch('/api/auth/state', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (state) {
      setMode(state && state.bootstrapped ? 'signin' : 'register');
      boot.hidden = true;
      form.hidden = false;
      (state && state.bootstrapped ? email : displayName).focus();
    })
    .catch(function () {
      boot.textContent = 'Could not reach the server. Refresh to try again.';
    });
})();
</script>
</body>
</html>
